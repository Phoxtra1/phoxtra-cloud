# Fly.io Database Configuration — phoxtra-db
# Database Service Deployment Specification (MariaDB 10.11)

app = "phoxtra-db"
primary_region = "ams"

[build]
  image = "mariadb:10.11"

cmd = ["mariadbd", "--bind-address=0.0.0.0", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci", "--max-allowed-packet=64M", "--innodb-buffer-pool-size=512M", "--max-connections=1024", "--innodb-log-file-size=64M"]

[env]
  MYSQL_DATABASE = "appwrite"
  MYSQL_USER = "appwrite"

[[mounts]]
  source = "phoxtra_db_data"
  destination = "/var/lib/mysql"

[[services]]
  protocol = "tcp"
  internal_port = 3306

[[services.ports]]
    port = 3306

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
