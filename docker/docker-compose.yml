# Phoxtra Cloud Self-Hosting Infrastructure — Production Docker Compose (Phase 2)
# Architecture: phoxtra-gateway (Caddy) -> phoxtra-console & phoxtra-appwrite -> phoxtra-mariadb 10.11 & phoxtra-redis 7

services:

  phoxtra-gateway:
    image: caddy:2.9-alpine
    container_name: phoxtra-cloud-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../configs/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - phoxtra-appwrite
      - phoxtra-console
    networks:
      - phoxtra-net
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 10s
      timeout: 5s
      retries: 3

  phoxtra-console:
    image: appwrite/console:latest
    container_name: phoxtra-cloud-console
    restart: unless-stopped
    env_file:
      - ../.env
    networks:
      - phoxtra-net

  phoxtra-appwrite:
    image: appwrite/appwrite:2.0.0
    container_name: phoxtra-cloud-appwrite
    restart: unless-stopped
    env_file:
      - ../.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        php app/worker.php audits &
        php app/worker.php databases &
        php app/worker.php deletes &
        php app/worker.php functions &
        php app/worker.php mails &
        php app/worker.php messaging &
        php app/worker.php webhooks &
        php app/worker.php stats-usage &
        php app/worker.php stats-resources &
        php app/worker.php migrations &
        php app/worker.php builds &
        php app/worker.php certificates &
        php app/worker.php executions &
        php app/worker.php screenshots &
        exec docker-php-entrypoint php app/http.php
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_DOMAIN=${_APP_DOMAIN:-cloud.phoxtra.com}
      - _APP_DOMAIN_TARGET=${_APP_DOMAIN_TARGET:-cloud.phoxtra.com}
      - _APP_DOMAIN_TARGET_CNAME=${_APP_DOMAIN_TARGET_CNAME:-cloud.phoxtra.com}
      - _APP_DOMAIN_CONSOLE=${_APP_DOMAIN_CONSOLE:-}
      - _APP_DOMAIN_API=${_APP_DOMAIN_API:-}
      - _APP_CONSOLE_HOSTNAMES=${_APP_CONSOLE_HOSTNAMES:-cloud.phoxtra.com,cloud.phoxtra.localhost,localhost,127.0.0.1,phoxtra-cloud.fly.dev,*.fly.dev,*.phoxtra.com}
      - _APP_EMAIL_CERTIFICATES=${_APP_EMAIL_CERTIFICATES:-admin@phoxtra.com}
      - _APP_OPTIONS_FORCE_HTTPS=${_APP_OPTIONS_FORCE_HTTPS:-disabled}
      - _APP_OPTIONS_ROUTER_PROTECTION=${_APP_OPTIONS_ROUTER_PROTECTION:-disabled}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1:-75d5bbf089a47db14672af094ecd88fe03abd745d77d82809432a6be2c6f35b6}
      - _APP_SYSTEM_EMAIL_NAME=${_APP_SYSTEM_EMAIL_NAME:-Phoxtra Cloud}
      - _APP_SYSTEM_EMAIL_ADDRESS=${_APP_SYSTEM_EMAIL_ADDRESS:-admin@phoxtra.com}
      - _APP_CONSOLE_WHITELIST_ROOT=${_APP_CONSOLE_WHITELIST_ROOT:-disabled}
      - _APP_EXECUTOR_HOST=${_APP_EXECUTOR_HOST:-http://phoxtra-executor:8080/v1}
      - _APP_EXECUTOR_SECRET=${_APP_EXECUTOR_SECRET:-your-secret-key}
      - _APP_CONNECTIONS_MAX=${_APP_CONNECTIONS_MAX:-1024}
      - _APP_POOL_CLIENTS=${_APP_POOL_CLIENTS:-1}

      - _APP_DB_ADAPTER=${_APP_DB_ADAPTER:-mariadb}
      - _APP_DATABASE_SHARED_TABLES=${_APP_DATABASE_SHARED_TABLES:-database_db_main}
      - _APP_DATABASE_SHARED_NAMESPACE=${_APP_DATABASE_SHARED_NAMESPACE:-appwrite}
      - _APP_CONNECTIONS_DATABASE=${_APP_CONNECTIONS_DATABASE:-db_main=mariadb://appwrite:c5dde33a93bae60b4f72728f30e133ef03c2012cc1b70095@phoxtra-mariadb:3306/appwrite}
      - _APP_DB_HOST=phoxtra-mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_USER=${MYSQL_USER:-appwrite}
      - _APP_DB_PASS=${MYSQL_PASSWORD:-c5dde33a93bae60b4f72728f30e133ef03c2012cc1b70095}
      - _APP_DB_SCHEMA=${MYSQL_DATABASE:-appwrite}
      - _APP_REDIS_HOST=phoxtra-redis
      - _APP_REDIS_PORT=6379
      - _APP_REDIS_USER=
      - _APP_REDIS_PASS=
      - _APP_REDIS_AUTH=



      - _APP_STORAGE_LIMIT=${_APP_STORAGE_LIMIT:-1073741824}

    volumes:
      - appwrite-uploads:/storage/uploads
      - appwrite-certificates:/storage/certificates
      - appwrite-config:/storage/config
    depends_on:
      phoxtra-mariadb:
        condition: service_healthy
      phoxtra-redis:
        condition: service_healthy
    networks:
      - phoxtra-net

  phoxtra-mariadb:
    image: mariadb:10.11
    container_name: phoxtra-cloud-mariadb
    restart: unless-stopped
    command: mariadbd --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --max-allowed-packet=64M --innodb-buffer-pool-size=512M --max-connections=150 --innodb-log-file-size=64M
    env_file:
      - ../.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-3ee3e3567efbcb93af77250a25f01e90bdd883b8d033b597}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appwrite}
      MYSQL_USER: ${MYSQL_USER:-appwrite}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-c5dde33a93bae60b4f72728f30e133ef03c2012cc1b70095}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - phoxtra-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phoxtra-executor:
    image: openruntimes/executor:0.29.0
    container_name: phoxtra-executor
    hostname: phoxtra-executor
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - ../.env
    networks:
      - phoxtra-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appwrite-builds:/storage/builds:rw
      - appwrite-functions:/storage/functions:rw
      - appwrite-sites:/storage/sites:rw
      - /tmp:/tmp:rw
    environment:
      - OPR_EXECUTOR_IMAGES=${_APP_EXECUTOR_IMAGES:-openruntimes/node:v5-22,openruntimes/static:v5-1}
      - OPR_EXECUTOR_INACTIVE_THRESHOLD=${_APP_COMPUTE_INACTIVE_THRESHOLD:-60}
      - OPR_EXECUTOR_MAINTENANCE_INTERVAL=${_APP_COMPUTE_MAINTENANCE_INTERVAL:-3600}
      - OPR_EXECUTOR_NETWORK=${_APP_COMPUTE_RUNTIMES_NETWORK:-phoxtra-net}
      - OPR_EXECUTOR_DOCKER_HUB_USERNAME=${_APP_DOCKER_HUB_USERNAME:-}
      - OPR_EXECUTOR_DOCKER_HUB_PASSWORD=${_APP_DOCKER_HUB_PASSWORD:-}
      - OPR_EXECUTOR_ENV=${_APP_ENV:-production}
      - OPR_EXECUTOR_RUNTIMES=${_APP_FUNCTIONS_RUNTIMES:-node-20.0},${_APP_SITES_RUNTIMES:-}
      - OPR_EXECUTOR_SECRET=${_APP_EXECUTOR_SECRET:-your-secret-key}
      - OPR_EXECUTOR_RUNTIME_VERSIONS=v5
      - OPEN_RUNTIMES_NFT=${_APP_OPEN_RUNTIMES_NFT:-disabled}
      - OPR_EXECUTOR_LOGGING_CONFIG=${_APP_LOGGING_CONFIG:-}
      - OPR_EXECUTOR_CONNECTION_STORAGE=${_APP_EXECUTOR_CONNECTION_STORAGE:-local://localhost}
      - OPR_EXECUTOR_CONNECTION_BUILD_CACHE_STORAGE=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  phoxtra-redis:
    image: redis:7-alpine
    container_name: phoxtra-cloud-redis
    restart: unless-stopped
    env_file:
      - ../.env
    command: redis-server
    volumes:
      - redis-data:/data
    networks:
      - phoxtra-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  mariadb-data:
    driver: local
  redis-data:
    driver: local
  appwrite-uploads:
    driver: local
  appwrite-certificates:
    driver: local
  appwrite-config:
    driver: local
  appwrite-builds:
    driver: local
  appwrite-functions:
    driver: local
  appwrite-sites:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  phoxtra-net:
    driver: bridge

