# Phoxtra Cloud Self-Hosting Infrastructure — Production Docker Compose
# Architecture: Appwrite + MariaDB 10.11 + Redis 7 + Persistent Volumes

services:

  phoxtra-appwrite:
    image: appwrite/appwrite:${APPWRITE_VERSION:-latest}
    container_name: phoxtra-cloud-appwrite
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_DOMAIN=${_APP_DOMAIN:-cloud.phoxtra.com}
      - _APP_DB_HOST=phoxtra-mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_USER=${MYSQL_USER:-appwrite}
      - _APP_DB_PASS=${MYSQL_PASSWORD}
      - _APP_DB_SCHEMA=${MYSQL_DATABASE:-appwrite}
      - _APP_REDIS_HOST=phoxtra-redis
      - _APP_REDIS_PORT=6379
      - _APP_REDIS_USER=
      - _APP_REDIS_PASS=${REDIS_PASSWORD}
    volumes:
      - appwrite-uploads:/storage/uploads
      - appwrite-certificates:/storage/certificates
      - appwrite-config:/storage/config
    depends_on:
      phoxtra-mariadb:
        condition: service_healthy
      phoxtra-redis:
        condition: service_healthy
    networks:
      - phoxtra-net

  phoxtra-mariadb:
    image: mariadb:10.11
    container_name: phoxtra-cloud-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appwrite}
      MYSQL_USER: ${MYSQL_USER:-appwrite}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - phoxtra-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phoxtra-redis:
    image: redis:7-alpine
    container_name: phoxtra-cloud-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - phoxtra-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb-data:
    driver: local
  redis-data:
    driver: local
  appwrite-uploads:
    driver: local
  appwrite-certificates:
    driver: local
  appwrite-config:
    driver: local

networks:
  phoxtra-net:
    driver: bridge
